[package]
name = "vmark"
version = "0.9.62"
description = "The plain-text workspace where humans and AI collaborate"
authors = ["Xiaolai"]
license = "ISC"
edition = "2021"
# Required since `pdf_smoke` was added: a second [[bin]] makes bare `cargo run`
# ambiguous, and `tauri dev` runs exactly that — so without this, `pnpm
# tauri:dev` dies with "could not determine which binary to run" before the app
# ever starts. `required-features` does NOT exempt a binary from that count.
# No frontend gate can see this: `pnpm check:all` never invokes cargo, and the
# cross-target check runs `clippy`, not `run`.
default-run = "vmark"

[lib]
name = "vmark_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` is what makes `trafficLightPosition` work. Without it the
# position is ignored SILENTLY — the app builds, the config parses, and the
# lights stay where AppKit put them, with nothing reporting why.
#
# It stays on THIS line, literally and unconditionally. tauri-build reads this
# `features = [...]` array as MANIFEST TEXT and, with `macOSPrivateApi: true` in
# tauri.conf.json, refuses to build unless the feature is spelled out here — it
# knows nothing about `[features]` forwarding, and the same check runs against
# the same config on every target, so hiding it behind a cfg only changes which
# platform fails. It is inert off macOS.
#
# It also bars the Mac App Store. VMark ships notarized Developer ID DMGs via
# tauri-action, so that costs nothing today; it would have to be reconsidered
# before any App Store submission.
tauri = { version = "2", features = ["macos-private-api", "protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-mcp-bridge = "0.12"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
# WI-14: derive macro for the crate-wide `CommandError`. dtolnay's crate, the
# de-facto standard for library error types (~500M downloads, first published
# 2019, already in the lockfile transitively via tauri). Compile-time only —
# it generates `Display`/`Error` impls and adds no runtime dependency.
thiserror = "2"
# `preserve_order` keeps `serde_json::Map` in document order (IndexMap) rather
# than sorting it (BTreeMap). Without it, every `mcp_config` install parsed and
# re-serialised the user's `~/.claude.json` into alphabetical order at every
# nesting level — a whole-file diff on a config people keep in dotfile repos,
# which buries the one line that actually changed.
#
# This is a crate-wide feature (cargo unifies features), so it also applies to
# Tauri's own IPC serialisation. That was checked before enabling: nothing in
# this crate iterates a `serde_json::Map` expecting sorted keys, and every test
# touching serialised JSON uses `contains()`, a parse-back round trip, or
# compares two serialisations to each other — none assume an order. JSON object
# key order carries no semantics for any consumer here.
serde_json = { version = "1", features = ["preserve_order"] }
# v7 feature added for the coherence layer (time-ordered ledger/object IDs,
# spec §2) — same pinned crate, no new package (ADR-C5).
uuid = { version = "1", features = ["v4", "v7"] }
regex = "1"
# Recoverable deletion for orphan-image cleanup (WI-12). Cleanup DELETES user
# files on inference; the trash gives every wrong call an undo. `trash` is the
# de-facto standard (maintained by Byron of gitoxide, ~5M downloads,
# cross-platform: macOS NSFileManager, Windows Recycle Bin, XDG trash).
trash = "5"
urlencoding = "2"
# WHATWG-spec URL parser — the same spec the browser's `URL` implements, so the
# Rust origin guard (browser/origin_guard.rs) and the TS spec it mirrors parse
# identically instead of drifting. Already in the tree via tauri; promoting it to
# a direct dependency adds no new package to the lockfile.
url = "2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
tokio = { version = "1", features = ["sync", "macros", "rt-multi-thread", "process", "io-util", "time"] }
tokio-tungstenite = "0.30"
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = "0.3"
portable-pty = "0.9"
toml = "1.1"
# Format-preserving TOML document model, used ONLY by `mcp_config` for
# `~/.codex/config.toml`. `toml`'s parse -> `toml::Table` -> `to_string_pretty`
# round trip drops every comment and re-sorts every key. Unlike `~/.claude.json`
# — machine-managed state, where `preserve_order` above is enough — the Codex
# config is a file users hand-write and hand-comment, so that round trip
# destroyed their own work on every install and every Repair click. No serde
# feature can give a comment back; only a document model that keeps the
# original spans can, which is what this crate is for.
#
# Not a new supply-chain surface: same crate family, same repository
# (github.com/toml-rs/toml) and the same `toml-rs/toml` owner team as `toml`
# itself (695M all-time / 165M recent downloads, first published 2017). The 0.25
# line is the generation matching our `toml = "1.1"` — both carry the
# `+spec-1.1.0` metadata and share `toml_parser`, `toml_datetime` and `winnow`.
# `toml_edit@0.25.12+spec-1.1.0` was already in the lockfile (reached via
# `proc-macro-crate` on the Android `ndk` path), so promoting it to a direct
# dependency adds no new package and no new transitive dependency. Default
# features (`parse` + `display`) only; `serde` is deliberately off — the
# document model is used directly, nothing is deserialised through it.
toml_edit = "0.25"
dirs = "6"
chrono = "0.4"
reqwest = { version = "0.13", features = ["json"] }
tauri-plugin-window-state = "2"
tauri-plugin-store = "2"
tempfile = "3"
sha2 = "0.10"
ed25519-dalek = "3"
base64 = "0.23"
gethostname = "1.1"
rust-i18n = "4"
# RW-16 (L8): OS-backed secret storage for API keys. Platform credential
# stores are enabled per-target below (apple-native / windows-native /
# sync-secret-service); the base dep carries no platform backend so it stays
# buildable everywhere and the `mock` store is available for tests.
keyring = { version = "3", default-features = false }
serde_yaml_ng = "0.10"
# Coherence layer (ADR-C5, reviewed in dev-docs/grills/coherence/
# dependency-review.md): bundled SQLite pins 3.5x everywhere (macOS system
# sqlite is an Apple build, Windows has none — S2 spike decision); NFC
# canonicalization per spec §3.1 needs the real Unicode tables.
rusqlite = { version = "0.40", features = ["bundled"] }
unicode-normalization = "0.1"
lopdf = { version = "0.44.0", default-features = false }

# Windows and Linux start a FRESH process for every file-association
# double-click; macOS does not (one process per bundle identifier, later opens
# arrive as `RunEvent::Opened`). A second process shares this app's
# localStorage, app-data directory and hot-exit session, so it corrupts the
# running one rather than merely duplicating it — see `src/single_instance.rs`
# and #1330. Official Tauri plugin, same workspace as every other
# `tauri-plugin-*` here. Rust-only: it has no `@tauri-apps/*` counterpart, so
# `lint:tauri-versions` correctly skips it.
[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
block2 = "0.6" # SPIKE-1/5 probe (throwaway) — remove with src/spike_embed.rs before WI-1.2
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSMenu", "NSMenuItem", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSResponder", "NSDocumentController", "NSPrintInfo", "NSPrintOperation", "NSView", "NSWindow", "NSGraphics", "NSEvent"] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSURLRequest", "NSData", "NSDate", "NSRunLoop", "NSError", "NSDictionary", "NSValue", "NSKeyValueObserving", "NSProcessInfo", "NSUserDefaults", "NSArray", "NSUUID", "NSHTTPCookie"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKWebViewConfiguration", "WKNavigation", "WKNavigationDelegate", "WKUIDelegate", "WKNavigationAction", "WKWindowFeatures", "WKFrameInfo", "WKPDFConfiguration", "WKSnapshotConfiguration", "WKWebsiteDataStore", "WKUserScript", "WKUserContentController", "WKContentWorld", "WKContentRuleList", "WKContentRuleListStore", "WKHTTPCookieStore", "block2", "objc2-core-foundation"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFOutline", "PDFPage", "PDFDestination"] }
objc2-core-foundation = { version = "0.3", features = ["CFRunLoop", "CFString"] }

# RW-16 (L8): Windows Credential Manager backend (best-effort platform).
# The PDF smoke harness lives in src/bin/ and is gated behind a feature, so it
# is never part of a normal build or bundle.
#
# It is not in examples/: a file there is auto-discovered as an `example`
# target, and declaring it as a bin too made cargo build it twice and warn
# about one file in multiple targets.
#
# It has to be a bin: as an `--example` it links but dies at startup on Windows
# with STATUS_ENTRYPOINT_NOT_FOUND (0xC0000139) — the same code this file
# already records for the MockRuntime test binary. `tauri-build` embeds the
# Windows app manifest and forces a static CRT for the crate's binaries;
# examples and tests do not get the same treatment, and the loader then cannot
# resolve an import. The shipped bin has always worked, which is the clue.
[[bin]]
name = "pdf_smoke"
required-features = ["pdf-smoke"]

[features]
pdf-smoke = []

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# WI-PDF2.1: PDF export via ICoreWebView2_7::PrintToPdf.
#
# These are already in the tree through wry, but a transitive crate cannot be
# imported — and the versions must match wry's EXACTLY. A different major here
# makes ICoreWebView2* a distinct Rust type, so `cast()` stops compiling
# against the controller Tauri hands us. Verified with
# `cargo tree --target x86_64-pc-windows-msvc`; re-check on any wry bump.
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
windows = { version = "=0.61.3", features = ["Win32_Foundation"] }

# RW-16 (L8): Linux Secret Service backend (best-effort platform).
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }
# WI-PDF3.1: PDF export via webkit_print_operation_print().
#
# Pinned to what wry resolves for this target. Tauri hands back a
# `webkit2gtk::WebView` from `PlatformWebview::inner()`; a different version
# here is a different Rust type and the print operation cannot be built from
# it. Verified with `cargo tree --target x86_64-unknown-linux-gnu`.
webkit2gtk = "=2.0.2"
gtk = "=0.18.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread"] }

# Tauri's `test` feature enables mock_app / mock_builder for command-wiring
# tests (fs scope extension, path validation, etc.). It is scoped to non-
# Windows targets because the MockRuntime test binary triggers
# STATUS_ENTRYPOINT_NOT_FOUND (exit code 0xc0000139) at startup on
# windows-latest runners — the build links but the loader can't resolve
# a symbol in the test DLL path. macOS and Linux are fine. Callers of
# tauri::test are cfg-gated accordingly in tests.
[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
tauri = { version = "2", features = ["protocol-asset", "test"] }

# Release profile tuned for distribution.
# - lto = "thin": ~5–8% smaller binary, ~25% slower link, retains good per-fn opt.
# - codegen-units = 1: aggressive optimization across the crate; slower builds.
# - strip = "symbols": drop symbol tables; macOS keeps a separate .dSYM if produced.
# - panic stays "unwind" (the default): the containment architecture relies on
#   `catch_unwind` (task.rs spawn wrappers, pty.rs reader thread, hot_exit,
#   cli_install, workflow approval) to keep a panicking background task from
#   taking down the whole app; `panic = "abort"` would defeat all of it for a
#   ~2–3% size win.
[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
