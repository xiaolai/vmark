  browser.stateUnavailable: "The browser state could not be read: %{detail}"
  browser.invalidUrl: "That is not a usable web address"
  browser.invalidProfileName: "That browser profile name is not allowed"
  browser.windowGone: "The window this browser tab belongs to has closed"
