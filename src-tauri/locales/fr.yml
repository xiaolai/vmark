  # MCP client config — reading, backing up and writing
  mcp.readFailed: "Échec de la lecture de %{path} : %{detail}"
  mcp.createDirFailed: "Échec de la création du répertoire %{path} : %{detail}"
  mcp.configChangedOnDisk: "%{path} a changé sur le disque pendant que VMark le mettait à jour. Fermez le client qui l'écrit et réessayez."
