  workflow.appDataDirUnavailable: "Impossible de résoudre le répertoire de données de l'application : %{detail}"

  # === Chemin d'enregistrement (file_write.rs, WI-14 CommandError) ===
  save.parentMissing: "Le dossier de ce fichier n'existe plus : %{dir}"
  save.noParentDirectory: "Le chemin du fichier n'a pas de dossier parent"
  save.writeFailed: "Impossible d'enregistrer le fichier : %{detail}"
  save.taskFailed: "La tâche d'enregistrement s'est terminée de manière inattendue : %{detail}"

  # === Navigateur intégré, navigation de l'IA (browser/ai_commands.rs, WI-14) ===
  browser.disabled: "Le navigateur intégré est désactivé dans les Réglages"
  browser.approvalRequired: "Cette page nécessite votre autorisation avant que l'IA puisse l'ouvrir"
  browser.blockedDestination: "La politique bloque la navigation de l'IA vers cette destination"
  browser.profileNotApproved: "L'ouverture de ce profil de navigateur n'a pas été autorisée"
  browser.tabNotFound: "Cet onglet du navigateur n'existe plus"
  browser.tabNotAiOwned: "Cet onglet du navigateur n'est pas contrôlé par l'IA"
  browser.policyStale: "La politique du navigateur a changé : réessayez l'action"
  browser.tabProvenanceMismatch: "Cet onglet a été créé dans un autre mode d'automatisation"
