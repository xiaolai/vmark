  mcp.backupSyncFailed: "Échec de la synchronisation de la sauvegarde %{path} : %{detail}"
  mcp.backupCreateFailed: "Échec de la création de la sauvegarde %{path} : %{detail}"
  mcp.backupVariantsExhausted: "Échec de la création de la sauvegarde : %{count} variantes de %{path} existent déjà"
  mcp.stageConfigFailed: "Échec de la préparation de la configuration dans %{dir} : %{detail}"
  mcp.restrictStagedConfigFailed: "Échec de la restriction des permissions de la configuration préparée %{path} : %{detail}"
  mcp.writeStagedConfigFailed: "Échec de l'écriture de la configuration préparée pour %{path} : %{detail}"
  mcp.createConfigFailed: "Échec de la création de %{path} : impossible de mettre en place une copie préparée par lien physique (%{link_detail}), et impossible de créer le fichier directement (%{open_detail})."
