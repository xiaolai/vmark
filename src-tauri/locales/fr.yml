  pdf.dirNotFound: "Le répertoire de sortie n'existe pas"
  pdf.pathNotAbsolute: "Le chemin de sortie doit être absolu"
  pdf.outputIsDirectory: "Le chemin de sortie est un dossier"
  pdf.loadTimeout: "Délai de chargement HTML dépassé (10 s)"
