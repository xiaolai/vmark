  browser.stateUnavailable: "Impossible de lire l'état du navigateur : %{detail}"
  browser.invalidUrl: "Ce n'est pas une adresse web utilisable"
  browser.invalidProfileName: "Ce nom de profil de navigateur n'est pas autorisé"
  browser.windowGone: "La fenêtre à laquelle appartient cet onglet du navigateur a été fermée"
  browser.profileLimit: "Trop de profils de navigateur sont ouverts en même temps"
  browser.unsupportedPlatform: "Le navigateur intégré n'est pas disponible sur cette plateforme"
  browser.surfaceTimeout: "Le navigateur n'a pas répondu à temps"
