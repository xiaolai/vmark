  pdf.dispatchFailed: "Échec de l'envoi au thread principal : %{detail}"
  pdf.abandoned: "L'opération PDF a été abandonnée avant de produire un résultat"
  pdf.channelClosed: "L'opération PDF s'est terminée sans résultat"
  pdf.exportTimeout: "L'export PDF a expiré après %{seconds} secondes"
