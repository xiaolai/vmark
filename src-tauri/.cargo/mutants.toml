# cargo-mutants configuration (audit L13 / RW-14, hardening v1-017 / v2-016;
# relocated by WI-4).
#
# THIS PATH IS LOAD-BEARING: cargo-mutants reads `.cargo/mutants.toml` relative
# to the workspace root of the manifest (src-tauri/ is its own workspace), so
# this file MUST live at src-tauri/.cargo/mutants.toml. It sat at
# src-tauri/mutants.toml — silently ignored — for its entire history, so every
# CI mutation run mutated the unfiltered tree (4,202 mutants at relocation
# time vs 139 scoped) into its 60-minute timeout. Guarded by
# `pnpm lint:mutants-config` (scripts/check-mutants-config-path.mjs).
#
# Scopes mutation testing to a few high-value, pure-logic modules that have
# real branching and solid existing unit tests. A run mutates ONLY these files,
# keeping the loop fast and the signal high — instead of mutating the whole
# Tauri backend (most of which is I/O / FFI glue that mutation testing can't
# meaningfully evaluate without a running app).
#
# Run it (binary is NOT required for `cargo test`/`cargo check`):
#   cargo install cargo-mutants
#   cargo mutants --in-place --manifest-path src-tauri/Cargo.toml
# Verify the scope applies (must list only the examine_globs files):
#   cargo mutants --list --manifest-path src-tauri/Cargo.toml
#
# `--in-place` IS REQUIRED, and it cannot live in this file: cargo-mutants 27.1.0
# has no config key for it. Without it the run happens in a copy of src-tauri/
# alone, and this crate's tests read the frontend tree next to it
# (`../src/...`): the unmutated baseline fails with NotFound (#1210, #1409),
# and on macOS the copy does not even compile. In place, each mutant is applied
# to the working tree and reverted after its test, including on Ctrl-C; commit
# or stash first. cargo-mutants refuses `--in-place` with `--jobs` (or
# CARGO_MUTANTS_JOBS), so a run is serial. `scripts/check-mutation-in-place.test.mjs`
# pins the CI invocation.
#
# See dev-docs/testing-hardening.md for the rationale and how to widen scope.

# Only mutate these files. Globs are matched against paths relative to the
# package root (src-tauri/).
examine_globs = [
    "src/workflow/expressions.rs",
    "src/workflow/condition.rs",
    "src/genies/parsing.rs",
]

# Belt-and-suspenders: never mutate generated, test, or platform-FFI code even
# if a future examine_globs edit accidentally widens scope.
exclude_globs = [
    "src/**/tests.rs",
    "src/**/*_test.rs",
    "fuzz/**",
]

# Skip mutating inside #[cfg(test)] / #[test] blocks — we want to mutate the
# code under test, not the tests themselves.
exclude_re = [
    "#\\[test\\]",
]

# Run each mutant against the scoped modules' OWN tests, not the whole crate
# (#1557). cargo-mutants' default is `cargo test --package=vmark`, i.e. every
# lib unit test plus every integration-test binary, for every mutant. That
# suite grows with the crate, not with this scope: the per-mutant test phase
# went from ~20s (2026-08-31, 139 mutants, 2h) to ~60s (2026-10-12, 146
# mutants, 3h58m against the job's 240-minute bound). The Stryker job died of
# the same growth term the same week.
#
# - `--lib` (both phases): skip building and running the `tests/*.rs`
#   binaries, none of which touch workflow/ or genies/.
# - the filters (test phase only; cargo-mutants appends these after its own
#   arguments): libtest runs a test whose path contains any of them. Measured
#   locally: 552 of 3,921 lib tests, 1.9s instead of 44.5s.
#   `command_error_from` is the one module outside the two subsystems that
#   names a scoped type (`ExprError`).
# A mutant that only a test elsewhere in the crate killed now counts as
# missed. That is deliberate: the question is whether these modules' own tests
# pin their behaviour. A new examine_glob needs its module listed here;
# scripts/check-mutation-scope.test.mjs fails otherwise.
additional_cargo_args = ["--lib"]
additional_cargo_test_args = ["--", "workflow::", "genies::", "command_error_from"]

# Give each test build+run a generous-but-bounded timeout so a mutation that
# induces an infinite loop is reported as "timeout" rather than hanging the run.
timeout_multiplier = 3.0
minimum_test_timeout = 60
