[package]
name = "s2-rusqlite-spike"
version = "0.1.0"
edition = "2021"
publish = false

# Spike S2 (WI-0.6): standalone probe — NOT part of the VMark app workspace.
# Validates rusqlite (bundled) index rebuild-from-scan and breakdown-query
# budgets from dev-docs/specs/coherence-format-v0.md §10.

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha2 = "0.11.0"
uuid = { version = "1.24.0", features = ["v4", "v7"] }

[profile.release]
debug = false
