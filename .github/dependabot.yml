# Dependabot policy (rev 2, 2026-06-17).
#
# Goal: keep deps current without drowning in PRs. Routine minor/patch
# updates are GROUPED into one PR per ecosystem/manifest per week; MAJOR
# updates are left ungrouped so each gets individual breaking-change
# scrutiny; SECURITY updates are ungrouped and prioritized by Dependabot.
# The github-actions ecosystem keeps the SHA-pinned actions fresh
# (audit 20260612 H25). Rust deps are additionally covered by cargo-audit
# in CI; new npm packages still pass scripts/check-new-deps.sh (rule 60 §4).
#
# Note: the rev-1 config opened 21 individual first-run PRs because it had
# no grouping and a misleading "security-only" comment that the config
# never enforced. Grouping fixes both.
#
# rev 3 (2026-08-13): there is now exactly ONE npm entry, because there is
# exactly one npm lockfile. A per-directory entry cannot keep a manifest and
# its lockfile in step unless BOTH sit in that directory, and this repo had
# two different ways of getting that wrong at once:
#
#   * `/server/mcp` and `/server/content` are pnpm WORKSPACE MEMBERS, so they
#     have no lockfile of their own — the root `pnpm-lock.yaml` is the only
#     one that resolves them. Their entries could rewrite a member
#     `package.json` but never the root lockfile, so every PR was born
#     failing `pnpm install --frozen-lockfile` with ERR_PNPM_OUTDATED_LOCKFILE
#     and was UNMERGEABLE. Six were opened, five closed unmerged (#1259,
#     #1239, #1237, #1189, #1167, #1166).
#   * `/website` was standalone with its own `website/pnpm-lock.yaml`, which
#     Dependabot did not update either — so its PRs merged green and left the
#     manifest and lockfile SILENTLY DRIFTED (#1238, #1129, #1038). Silent
#     because deploy-website.yml installed it without --frozen-lockfile. Two
#     manual repair commits came of it: bfc7d2456, c5486c5e3.
#
# Same root cause, opposite symptoms: one fails loudly and cannot land, the
# other lands and rots. Both are fixed by making every npm manifest in the
# repo a workspace member of the single root lockfile — see
# pnpm-workspace.yaml, which now lists website too — so this one `/` entry
# updates every manifest together with the lockfile in ONE consistent PR.
# Verified on #1261: package.json + pnpm-lock.yaml + server/content/package.json
# + server/mcp/package.json in a single green PR.
#
# Do not add a per-directory npm entry back. If a new npm package appears in
# this repo, add it to pnpm-workspace.yaml instead.
version: 2
updates:
  # The root manifest AND every pnpm workspace member — server/mcp,
  # server/content, website — because all of them resolve through the root
  # pnpm-lock.yaml. See the rev-3 note above.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Matches `minimumReleaseAge` in pnpm-workspace.yaml (one week): pnpm
    # refuses to resolve a younger version, so proposing one only produces a
    # PR that cannot update the lockfile. Security updates ignore the
    # cooldown; see the workspace file for what to do when one is too fresh.
    cooldown:
      default-days: 7
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]
        # Tiptap's minor releases carry type and editor-behaviour changes that
        # need the plugin tests migrated deliberately (#1736: the npm group at
        # Tiptap 3.34.0 failed 11 test files plus `lint:test-types`). Grouping
        # it with ~50 routine updates blocks all of them, so it gets its own PR.
        exclude-patterns:
          - "@tiptap/*"
      npm-tiptap:
        patterns:
          - "@tiptap/*"
        update-types: ["minor", "patch"]
    ignore:
      # @types/node tracks the Node runtime major (22 — CI, dev, and the
      # pkg-compiled sidecar all run 22). Majors are bumped manually when
      # the runtime moves, not by Dependabot (#1101/#1094, 2026-07).
      # Applies workspace-wide: server/mcp pins @types/node too.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types: ["minor", "patch"]
    ignore:
      # Pinned with `=` to the exact versions wry uses (see the comment above
      # them in src-tauri/Cargo.toml): another version makes the WebView2 COM
      # types distinct Rust types and the Windows build stops compiling. They
      # move only together, in the change that bumps Tauri/wry. #1540 bumped
      # windows-core alone and failed exactly that way.
      - dependency-name: "windows-core"
      - dependency-name: "windows"
      - dependency-name: "webview2-com"

  # `/` covers `.github/workflows` only. A composite action under
  # `.github/actions/` carries SHA pins of its own and is updated only when its
  # directory is listed here; scripts/check-supply-chain-pins.test.mjs fails
  # when one is missing.
  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/setup-node-pnpm
      - /.github/actions/setup-tauri-deps
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-patch:
        update-types: ["minor", "patch"]
