name: Update Homebrew Tap

on:
  # Triggered by release.yml via gh workflow run — not by release event directly
  # to avoid racing with asset uploads
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 0.3.0)'
        required: true

permissions:
  contents: read

# Publication is serialized. This job waits up to 15 minutes for DMGs and then
# mutates a SHARED repository, so two version dispatches could overlap and the
# older, slower one could finish last and overwrite the newer cask — pushing
# every `brew upgrade` user backwards (audit 20260906, C6).
#
# NOT `cancel-in-progress`: a run that has already pushed must be allowed to
# finish rather than be killed mid-mutation.
concurrency:
  group: update-homebrew-tap
  cancel-in-progress: false

jobs:
  update-tap:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VERSION: ${{ github.event.inputs.version }}
      REPO: xiaolai/vmark
    steps:
      - name: Validate version input
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version input must look like 'X.Y.Z' (got '$VERSION')"
            exit 1
          fi

      - name: Checkout homebrew-tap (early, for regression guard)
        uses: actions/checkout@v7
        with:
          repository: xiaolai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Guard against tap regression
        run: |
          # Refuse to publish a Homebrew cask that's older than (or equal to)
          # what the tap already has. Without this, a misfired workflow_dispatch
          # with the wrong version would push every `brew upgrade` user
          # backwards.
          CURRENT=$(grep '^  version "' homebrew-tap/Casks/vmark.rb 2>/dev/null \
            | head -1 | awk -F'"' '{print $2}')
          if [ -z "$CURRENT" ]; then
            echo "No existing cask version found — first publish, proceeding."
            exit 0
          fi
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "::error::Tap already at $CURRENT — refusing to re-publish."
            exit 1
          fi
          HIGHER=$(printf '%s\n%s' "$VERSION" "$CURRENT" | sort -V | tail -1)
          if [ "$HIGHER" != "$VERSION" ]; then
            echo "::error::Refusing to downgrade tap from $CURRENT to $VERSION"
            exit 1
          fi
          echo "✅ $VERSION > $CURRENT — proceeding"

      - name: Wait for DMGs to be available
        run: |
          ARM_URL="https://github.com/${REPO}/releases/download/v${VERSION}/VMark_${VERSION}_aarch64.dmg"
          INTEL_URL="https://github.com/${REPO}/releases/download/v${VERSION}/VMark_${VERSION}_x64.dmg"

          echo "Waiting for DMGs..."
          echo "ARM: $ARM_URL"
          echo "Intel: $INTEL_URL"

          # curl -L follows redirects; -w "%{http_code}" reports the FINAL
          # code. Match only 200 — the previous "302|200" regex was dead
          # code (with -L, 302 never reaches the output) and misled readers
          # into thinking we accepted unfollowed redirects.
          for i in {1..30}; do
            ARM_CODE=$(curl -sI -o /dev/null -w "%{http_code}" -L "$ARM_URL")
            INTEL_CODE=$(curl -sI -o /dev/null -w "%{http_code}" -L "$INTEL_URL")

            if [ "$ARM_CODE" = "200" ] && [ "$INTEL_CODE" = "200" ]; then
              echo "Both DMGs are available!"
              exit 0
            fi
            echo "Attempt $i/30: Waiting... (ARM: $ARM_CODE, Intel: $INTEL_CODE)"
            sleep 30
          done

          echo "DMGs not available after 15 minutes"
          exit 1

      # DMG trust chain: Apple Developer ID codesigning + notarization,
      # enforced by Gatekeeper at install time on the user's machine. Tauri's
      # minisign signatures cover updater-format bundles only (.app.tar.gz,
       # .AppImage, .msi, .exe, .deb, .rpm) — there's no .dmg.sig to verify
      # against here. Don't add codesign --verify to this Linux job; it would
      # require a macOS runner (5× cost) to duplicate what every installing
      # user's Gatekeeper already enforces.
      - name: Download DMGs and calculate SHA256
        id: sha256
        run: |
          ARM_URL="https://github.com/${REPO}/releases/download/v${VERSION}/VMark_${VERSION}_aarch64.dmg"
          INTEL_URL="https://github.com/${REPO}/releases/download/v${VERSION}/VMark_${VERSION}_x64.dmg"

          # `curl -L` alone writes an ERROR BODY to the output file and exits
          # 0, so a 404 or a 503 got hashed and published as the cask's
          # checksum — every `brew install` would then fail the integrity check
          # (audit 20260906, C6).
          #
          #   --fail-with-body : non-zero exit on any HTTP >= 400
          #   --retry          : ride out a transient CDN hiccup
          # plus an explicit sanity check that what arrived is really a disk
          # image, because a 200 carrying the wrong bytes exits 0 too.
          fetch_dmg() {
            local url="$1" out="$2" label="$3"
            echo "Downloading $label DMG..."
            if ! curl -fL --fail-with-body --retry 3 --retry-delay 5 \
                 --retry-all-errors -o "$out" "$url"; then
              echo "::error::$label DMG download failed: $url"
              return 1
            fi
            # A DMG is tens of megabytes; an error page is kilobytes.
            local size
            size=$(stat -c%s "$out")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$label DMG is only $size bytes — not a disk image"
              head -c 400 "$out" || true
              return 1
            fi
            if ! file "$out" | grep -qiE 'zlib|bzip2|disk image|data'; then
              echo "::error::$label download is not a disk image: $(file "$out")"
              return 1
            fi
          }

          fetch_dmg "$ARM_URL" vmark-arm.dmg "ARM"
          SHA256_ARM=$(sha256sum vmark-arm.dmg | cut -d ' ' -f 1)
          echo "SHA256 (ARM): $SHA256_ARM"
          echo "sha256_arm=$SHA256_ARM" >> "$GITHUB_OUTPUT"
          rm vmark-arm.dmg

          fetch_dmg "$INTEL_URL" vmark-intel.dmg "Intel"
          SHA256_INTEL=$(sha256sum vmark-intel.dmg | cut -d ' ' -f 1)
          echo "SHA256 (Intel): $SHA256_INTEL"
          echo "sha256_intel=$SHA256_INTEL" >> "$GITHUB_OUTPUT"
          rm vmark-intel.dmg

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: xiaolai/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # The downgrade guard above ran BEFORE up to 15 minutes of waiting and
      # downloading, and THIS checkout then refreshed the tap — so the version
      # that guard approved may no longer be the tap's version (audit 20260906,
      # C6). Re-check against the freshly-fetched tree, immediately before
      # mutating it. The concurrency group makes the two runs sequential; this
      # makes the second one notice what the first published.
      - name: Re-check tap version against the refreshed checkout
        run: |
          CURRENT=$(grep '^  version "' homebrew-tap/Casks/vmark.rb 2>/dev/null \
            | head -1 | awk -F'"' '{print $2}')
          if [ -z "$CURRENT" ]; then
            echo "No existing cask version — first publish, proceeding."
            exit 0
          fi
          if [ "$VERSION" = "$CURRENT" ]; then
            echo "::error::Tap is already at $CURRENT — refusing to re-publish."
            exit 1
          fi
          NEWEST=$(printf '%s\n%s\n' "$VERSION" "$CURRENT" | sort -V | tail -1)
          if [ "$NEWEST" != "$VERSION" ]; then
            echo "::error::Tap is at $CURRENT, newer than $VERSION — refusing to downgrade."
            echo "::error::Another release published while this run was downloading."
            exit 1
          fi
          echo "Tap at $CURRENT, publishing $VERSION."

      - name: Generate cask formula
        env:
          SHA256_ARM: ${{ steps.sha256.outputs.sha256_arm }}
          SHA256_INTEL: ${{ steps.sha256.outputs.sha256_intel }}
        run: |
          cat > homebrew-tap/Casks/vmark.rb << RUBY
          cask "vmark" do
            version "${VERSION}"

            on_arm do
              sha256 "${SHA256_ARM}"
              url "https://github.com/${REPO}/releases/download/v#{version}/VMark_#{version}_aarch64.dmg"
            end

            on_intel do
              sha256 "${SHA256_INTEL}"
              url "https://github.com/${REPO}/releases/download/v#{version}/VMark_#{version}_x64.dmg"
            end

            name "VMark"
            desc "Modern Markdown editor with WYSIWYG and source mode"
            homepage "https://github.com/${REPO}"

            livecheck do
              url :homepage
              strategy :github_latest
            end

            # Homebrew can only express a MAJOR macOS version here, so this is
            # :ventura (13.0) while the real floor is 13.4 — see
            # scripts/check-webview-floor.mjs. The precise gate stays
            # LSMinimumSystemVersion from tauri.conf.json, which refuses to
            # open with a readable message; this line keeps `brew install` from
            # cheerfully installing onto Catalina, which it did until #1278.
            depends_on macos: :ventura

            app "VMark.app"

            zap trash: [
              "~/Library/Application Support/app.vmark",
              "~/Library/Caches/app.vmark",
              "~/Library/Preferences/app.vmark.plist",
              "~/Library/Saved Application State/app.vmark.savedState",
            ]
          end
          RUBY

          echo "Generated cask formula:"
          cat homebrew-tap/Casks/vmark.rb

      - name: Commit and push
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add Casks/vmark.rb
          git commit -m "Update vmark to ${VERSION}"
          git push
