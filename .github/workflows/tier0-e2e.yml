name: Tier-0 E2E Journeys

# The Tier-0 data-integrity journeys (save / autosave / external change /
# close-guard / line endings / terminal cwd) run against a LIVE debug build over
# the Tauri automation bridge on 127.0.0.1:9323. Until this workflow existed, no
# workflow referenced e2e/ at all: the flows were CI-verified only as mock
# choreography, and the real-app tier ran when a maintainer remembered.
#
# WI-17 pairs this with a fast per-PR tier — src/test/tier0/*, jsdom, real
# stores and services over a stateful fs fake — which is what `pnpm check:all`
# runs on every change. This workflow is the SLOW half: a real webview, a real
# filesystem, real timers.
#
# It runs the WHOLE journey suite, on Linux and on macOS. It began as the nine
# Tier-0 journeys named in a shell loop on one Linux runner, and the name of the
# workflow is from then. That left most of the suite running nowhere: journeys
# missing from the list never ran, and the embedded-browser journeys declare
# `platforms: ["darwin"]`, which the runner reports as not applicable on Linux
# and exits 0. So there is no list any more — `e2e/run-journeys.mjs` runs every
# journey file and each leg skips only what its platform cannot host — and
# scripts/check-e2e-schedule.test.mjs fails if a journey can run on no leg.
#
# The macOS leg is the only place the embedded browser (WKWebView) is exercised
# end to end. It is weekly, like the rest of this workflow; nothing here runs
# per pull request.
#
# Why weekly and not nightly: a debug Tauri build plus the journey suite is
# ~20-30 runner-minutes, the fast tier already guards every PR, and the two
# existing scheduled suites (mutation 06:00, rust-coverage 06:30 Monday) set the
# cadence. 07:00 Monday keeps them from contending for the same window.
#
# NOT non-blocking-by-hiding: there is no `continue-on-error` here. A failure
# fails the run and reports into a single rolling tracking issue, the pattern
# WI-4 established in mutation.yml after eight silent failures.
#
# Headed-runner caveat (e2e/README.md "CI"): GitHub-hosted Linux runners are
# headless, so that leg runs the app under Xvfb; the macOS runner has a window
# server and launches it directly. Neither can be proved by a local check —
# only a run of this workflow shows that a journey passes on its runner.
#
# First green run: 31303955024 @ f339798ba549e06c8f00ffc2951e23517218aa50
# (2026-08-09, workflow_dispatch, job `journeys`: success, 8/8 journeys).
# Verified with `gh run view --json headSha,conclusion,jobs`, never a bare
# `gh run watch`.
#
# It took EIGHT dispatches, and this workflow had never run once in the five
# days between being merged and being tried. Each failure was real:
#   1. the 180s bridge wait expired with cargo at 752/754 crates — `tauri dev`
#      compiles on startup, and a first run has no cache. It could not have
#      passed;
#   2. the readiness probe was a TCP connect, which succeeds when the listener
#      binds — before the window exists. "bridge up after 1s"; the real number
#      is 72s;
#   3. tab titles gained extensions on 2026-08-07 (6848de868) and every
#      fixture-opening journey had been broken since, invisibly;
#   4. the journeys assumed a session with >1 tab, which a maintainer's app
#      restores and a fresh CI profile does not — so the file loaded into the
#      guard tab, which is correct app behaviour;
#   5. the approve-button selector had gone stale, and `?.click()` made a miss
#      indistinguishable from a click;
#   6-7. two macOS-only process probes (`lsof`, and `ps -o comm=` path vs name)
#      that returned empty on Linux, presenting a broken harness as an app that
#      spawns no terminals.
# None was visible to review. That is what `scripts/check-gate-liveness.mjs`
# now watches for.

# liveness-gate: true
# cadence-days: 8
# on-failure: rolling-issue
#   ^ read by scripts/check-gate-liveness.mjs (WI-AF2.4). This workflow having
#     never run once, for five days after it was merged, is the finding that
#     produced that checker.

on:
  workflow_dispatch:
  # Weekly cadence: Monday 07:00 UTC (offset from mutation.yml and rust-coverage.yml).
  schedule:
    - cron: "0 7 * * 1"

# Reporting is a separate job so `issues: write` is not held by the job that
# builds and runs a debug desktop app: `journeys` compiles the Rust crate,
# installs npm dependencies and drives a live WebKitGTK process, all of which
# would otherwise execute with a token able to write to this repo's issues.
# The measurement job gets `contents: read`; only the reporting job, which runs
# no project code, can write. (Same change as .github/workflows/mutation.yml.)
permissions:
  contents: read

concurrency:
  group: tier0-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    name: Journeys (${{ matrix.os }})
    strategy:
      # One leg's failure says nothing about the other's journeys.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tauri-deps

      - name: Install Xvfb
        if: runner.os == 'Linux'
        shell: bash
        # Job-local rather than in the shared composite action: three other
        # workflows use that action and none of them needs a display.
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: rust-tier0-e2e-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-tier0-e2e-${{ runner.os }}-

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build the MCP sidecar
        # A real binary, not a stub: the app spawns it at startup, and the
        # journeys exercise a running app rather than a compile.
        run: pnpm --dir server/mcp build:sidecar

      - name: Compile the debug binary
        shell: bash
        # SEPARATE from the launch, and this is the whole point: `tauri dev`
        # compiles the crate on startup, so on a cache-cold runner the app does
        # not exist yet when the readiness probe starts counting. The first ever
        # run of this workflow (31298376571, 2026-08-09) died exactly there —
        # the 180-second bridge wait expired with cargo at 752/754 crates. The
        # workflow could not have passed its first run, which is precisely the
        # kind of claim only a live run can falsify.
        #
        # Compiling here also makes the two failure modes tell themselves
        # apart: a broken build fails with a compiler error, and the wait step
        # below then means only "the app started but never opened its bridge".
        # Folding them together produces the least useful message available —
        # a timeout that could mean anything.
        #
        # Same manifest and profile `tauri dev` uses, so this populates the
        # cache it will hit rather than a parallel one.
        run: cargo build --manifest-path src-tauri/Cargo.toml

      - name: Launch the debug app
        shell: bash
        env:
          # The 9323 automation bridge is compiled only under
          # `#[cfg(debug_assertions)]` — a release build has no bridge to talk to.
          RUST_BACKTRACE: "1"
        # Linux has no display, so the app gets a virtual one. The macOS runner
        # has a window server and a logged-in session; the app opens a real
        # window there.
        run: |
          mkdir -p e2e/artifacts
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            xvfb-run -a --server-args="-screen 0 1600x1200x24" \
              pnpm tauri:dev > e2e/artifacts/app.log 2>&1 &
          else
            pnpm tauri:dev > e2e/artifacts/app.log 2>&1 &
          fi
          echo "APP_PID=$!" >> "$GITHUB_ENV"

      - name: Wait for the app to become drivable
        shell: bash
        # NOT a TCP probe. `/dev/tcp/127.0.0.1/9323` succeeds the moment the
        # bridge binds its listener during Tauri setup — before the window
        # exists and long before the webview runs JS. Run 31298694760
        # (2026-08-09) reported "bridge up after 1s" and then failed all eight
        # journeys in 800ms with "Window 'main' not found". The port was a proxy
        # for readiness; e2e/wait-ready.mjs checks the property — window listed
        # AND `execute_js` evaluating, which is what every journey needs.
        #
        # The binary is already compiled by the step above, so this budget
        # covers only vite plus app startup, bounded inside the job timeout.
        run: |
          if ! node e2e/wait-ready.mjs --timeout-ms 300000; then
            tail -n 200 e2e/artifacts/app.log || true
            exit 1
          fi

      - name: Run every journey this platform can host
        shell: bash
        # No journey is named here, on purpose. A filtered run executes what
        # the list says, and the list is the thing that went stale. The
        # unfiltered runner loads every file in e2e/journeys, keeps going after
        # a failure, prints one PASS/FAIL/SKIP/N-A line per journey, checks that
        # the tab bar ends as it began, and exits non-zero if any journey failed
        # or a `coverageRequired` one was skipped.
        run: node e2e/run-journeys.mjs

      - name: Stop the app
        if: always()
        shell: bash
        run: kill "$APP_PID" 2>/dev/null || true

      - name: Upload journey artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          # Per leg: two jobs uploading under one name is an upload conflict.
          name: tier0-e2e-artifacts-${{ matrix.os }}
          path: e2e/artifacts/
          if-no-files-found: ignore

  # The ONLY job with `issues: write`. It fires when `journeys` failed OR hit
  # its own timeout-minutes, which GitHub reports as `cancelled` and which a
  # bare `if: failure()` skipped (#1557, where mutation.yml lost two weekly
  # verdicts that way). `!cancelled()` keeps a run cancelled by hand or by the
  # concurrency group quiet. Pinned by scripts/check-rolling-issue-timeouts.test.mjs.
  report:
    name: Report failures in the tracking issue
    needs: journeys
    if: ${{ !cancelled() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update the rolling issue
        env:
          # No checkout here, so gh is told the repository explicitly rather
          # than inferring it from a git remote.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOURNEYS_RESULT: ${{ needs.journeys.result }}
        run: |
          set -euo pipefail
          TITLE="Tier-0 E2E journeys failed"
          BODY="Job \`journeys\` failed on $(date -u +%Y-%m-%d): $RUN_URL (commit ${GITHUB_SHA})"
          # Only a leg's own timeout reaches here as `cancelled` (see `if:`).
          if [ "$JOURNEYS_RESULT" = "cancelled" ]; then
            BODY="Job \`journeys\` timed out (a leg hit its own timeout-minutes; GitHub reports that as cancelled) on $(date -u +%Y-%m-%d): $RUN_URL (commit ${GITHUB_SHA})"
          fi
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi

  resolve:
    # The reporting job above only ever OPENS or comments. Nothing closed the
    # rolling issue, so a fixed failure stayed open indefinitely and the next
    # reader re-investigates a solved problem — issue #1243 sat open across the
    # eight dispatches that fixed it and the green run that proved it. A rolling
    # issue needs both edges or it is a write-only log with an issue number.
    #
    # Same permission split as the reporting job, for the same reason: this job
    # checks out nothing and runs no project code, so `issues: write` is never
    # held by the job that compiles the crate and drives a live app.
    name: Close the tracking issue once journeys pass
    needs: journeys
    if: success()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Close the rolling issue
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Tier-0 E2E journeys failed"
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -z "$NUMBER" ]; then
            echo "No open tracking issue — nothing to close."
            exit 0
          fi
          gh issue close "$NUMBER" --reason completed --comment \
            "Journeys passed on $(date -u +%Y-%m-%d): $RUN_URL (commit ${GITHUB_SHA}). Closing automatically; a later failure reopens a fresh issue."
