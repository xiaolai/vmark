name: Mutation Testing

# Opt-in mutation testing, deliberately NOT run on every PR — it is slow and
# does not gate merges (a signal source, not a required check).
#   - Rust backend (audit L13 / RW-14, hardening v1-017 / v2-016): scoped
#     to a few pure-logic modules via src-tauri/.cargo/mutants.toml (the
#     path cargo-mutants actually reads; guarded by lint:mutants-config).
#   - TypeScript frontend: scoped to pure-logic modules via
#     stryker.config.json (Stryker + vitest runner).
#
# WI-4: `continue-on-error: true` used to hide every failure (8/8 runs
# failed invisibly). Jobs now fail loudly and report into a single rolling
# tracking issue instead — non-blocking for PRs, but never silent.
#
# WHY EVERY SCHEDULED RUN BEFORE 2026-08-04 READ AS "cancelled" (WI-AF2.2).
# Evidence, from `gh api` run history rather than recollection:
#
#   run id       created           event       run concl.  wall clock
#   30792371018  2026-08-03 07:05  schedule    cancelled   61 min
#   30244907645  2026-07-27 07:06  schedule    cancelled   60 min
#   29728934205  2026-07-20 08:45  schedule    cancelled   60 min
#   29237123040  2026-07-13 08:54  schedule    cancelled   61 min
#   28775220736  2026-07-06 07:30  schedule    cancelled   60 min
#   28356326301  2026-06-29 07:39  schedule    cancelled   61 min
#   27938035846  2026-06-22 07:57  schedule    cancelled   60 min
#   27532109014  2026-06-15 07:55  schedule    SUCCESS      5 min  ← job: failure
#   27123014078  2026-06-08 07:39  schedule    cancelled   61 min
#
# Two distinct causes, neither of them a human and neither the concurrency
# group (weekly runs never overlap, so `cancel-in-progress` never fired):
#
#   1. The seven 60-61 minute "cancellations" are the `mutants` job exceeding
#      `timeout-minutes: 60` (the value at 66bcf618). GitHub reports a job
#      killed by its own timeout as CANCELLED, which reads like an operator
#      action and is why this went unexamined for two months. Root cause: 139
#      Rust mutants do not fit in 60 minutes on a 2-core runner.
#   2. The lone "success" is worse than the failures: run conclusion `success`,
#      its only job `mutants` conclusion `failure`, five minutes end to end.
#      That is `continue-on-error: true` laundering a failed job into a green
#      run — the run-level history was not merely unhelpful, it was false.
#
# Both are fixed and the fix is measured, not guessed: timeouts are now 240 and
# 300 minutes, sized from run 30898727907, and the first genuinely green run
# (30921292001, 2026-08-04) took 95 and 183 minutes — inside the new bounds,
# far outside the old one. `continue-on-error` is gone.
#
# What is NOT yet proven: the SCHEDULE path under those timeouts. Every green
# run so far has been a `workflow_dispatch`, and a dispatch is not evidence
# about a cron. The first scheduled run after the fix is 2026-08-10 06:00 UTC;
# until its verdict is recorded here, this workflow's weekly cadence is
# untested. `scripts/check-gate-liveness.mjs` (WI-AF2.4) is what will notice if
# it silently stops producing verdicts again.
#
# REPORTING IS ITS OWN JOB, for two reasons:
#   - Least privilege. `issues: write` used to sit at workflow level, so every
#     step of both measurement jobs — including `cargo mutants` and Stryker
#     running third-party code under mutation — held a token that could write
#     to this repository's issues. The measurement jobs now run with
#     `contents: read`; only the reporting job, which runs no project code,
#     can write.
#   - One issue, not two. `mutants` and `ts-mutants` run in PARALLEL, and each
#     used to do its own list-then-create. Two simultaneous failures raced:
#     both saw no open issue and both created one, so the "single rolling
#     tracking issue" quietly became a pair. A single downstream job that
#     aggregates `needs.*.result` cannot race itself.
#
# See dev-docs/testing-hardening.md.

# liveness-gate: true
# cadence-days: 8
# on-failure: rolling-issue
#   ^ read by scripts/check-gate-liveness.mjs (WI-AF2.4). Seven scheduled runs
#     died at their own 60-minute timeout, reported as `cancelled`; that word is
#     why the checker refuses to count a cancellation as a verdict.

on:
  # Manual trigger from the Actions tab.
  workflow_dispatch:
  # Weekly cadence: Monday 06:00 UTC.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 240 # measured (run 30898727907): baseline 3.5 min green, then 139 mutants did not fit 60 min on a 2-core runner; weekly non-blocking job, headroom is cheap
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tauri-deps

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-mutants-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-mutants-${{ runner.os }}-

      - name: Create sidecar stub for Tauri build script
        shell: bash
        run: touch "src-tauri/binaries/vmark-mcp-server-x86_64-unknown-linux-gnu"

      - name: Install cargo-mutants
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2.85.10
        with:
          tool: cargo-mutants

      - name: Run scoped mutation testing
        # Scope is defined in src-tauri/.cargo/mutants.toml (examine_globs).
        # Exit-code semantics (first complete sweep, run 30905319861): for a
        # non-blocking SIGNAL job, surviving mutants (exit 2) and timeouts
        # (exit 3) ARE the report — the sweep completed and mutants.out holds
        # the findings. Only real errors fail the job: usage/internal (1) and
        # a red unmutated baseline (4), which is how this workflow's original
        # silent death began. See cargo-mutants' documented exit codes.
        run: |
          set +e
          cargo mutants --manifest-path src-tauri/Cargo.toml
          rc=$?
          set -e
          case "$rc" in
            0) echo "all mutants caught" ;;
            2|3) echo "sweep completed with findings (exit $rc) — that is the report, not a failure" ;;
            *) echo "cargo-mutants infrastructure error (exit $rc)"; exit "$rc" ;;
          esac

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutants-report
          path: src-tauri/mutants.out/
          if-no-files-found: ignore

  ts-mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 300 # measured (run 30898727907): 2,234/2,462 mutants at 90 min; the tail is timeout-class — bounded by stryker timeoutMS (see stryker.config.json)
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run scoped mutation testing (Stryker)
        # Scope is defined in stryker.config.json (mutate globs).
        run: pnpm mutation:ts

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: stryker-report
          path: reports/mutation/
          if-no-files-found: ignore

  # The ONLY job with `issues: write`, and the only one that talks to the issue
  # tracker at all. `if: failure()` on a job with `needs` means "run when any
  # job it depends on failed" — the same trigger the per-job steps had, so a
  # cancelled run still reports nothing.
  report:
    name: Report failures in the tracking issue
    needs: [mutants, ts-mutants]
    if: failure()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Create or update the rolling issue
        env:
          # No checkout here (nothing to build), so gh is told the repository
          # explicitly rather than inferring it from a git remote.
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MUTANTS_RESULT: ${{ needs.mutants.result }}
          TS_MUTANTS_RESULT: ${{ needs['ts-mutants'].result }}
        run: |
          set -euo pipefail
          FAILED=""
          if [ "$MUTANTS_RESULT" = "failure" ]; then
            FAILED="${FAILED}- \`mutants\` (Rust, cargo-mutants)"$'\n'
          fi
          if [ "$TS_MUTANTS_RESULT" = "failure" ]; then
            FAILED="${FAILED}- \`ts-mutants\` (TypeScript, Stryker)"$'\n'
          fi
          if [ -z "$FAILED" ]; then
            echo "No job reported failure (results: $MUTANTS_RESULT / $TS_MUTANTS_RESULT) — nothing to report."
            exit 0
          fi

          TITLE="Mutation testing workflow failed"
          BODY="Failed on $(date -u +%Y-%m-%d): $RUN_URL (commit ${GITHUB_SHA})"$'\n\n'"$FAILED"
          NUMBER=$(gh issue list --state open --search "\"$TITLE\" in:title" \
            --json number,title --jq ".[] | select(.title == \"$TITLE\") | .number" | head -n1)
          if [ -n "$NUMBER" ]; then
            gh issue comment "$NUMBER" --body "$BODY"
          else
            gh issue create --title "$TITLE" --body "$BODY"
          fi
