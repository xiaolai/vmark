name: Refresh Star History chart

# Regenerates star-history.svg from live stargazer data and publishes it to
# the unprotected `star-history` branch — NOT to `main`: branch protection
# (enforce_admins + required checks, .claude/rules/60-ai-governance.md §10)
# rejects direct bot pushes there (GH006), which froze the README chart after
# 2026-07-22. README.md embeds the branch's raw URL. The chart is self-hosted
# because GitHub restricted the stargazers API to a repo's own admins and
# collaborators on 2026-06-30, so no third-party renderer can read this data
# at all any more — `gh` authenticated as the owner is the one path that still
# works (see scripts/gen-star-history.mjs).

on:
  schedule:
    # Weekly, Monday 06:10 UTC. Star growth is gradual — change to "10 6 * * *"
    # for daily if you want finer granularity.
    - cron: "10 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: star-history
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7 # main: the generator script

      - uses: actions/checkout@v7 # publication target
        with:
          ref: star-history
          path: chart

      # The generator imports roughjs (the hand-drawn renderer), so it DOES need
      # node_modules. This step used to be a bare `setup-node` under a comment
      # claiming "the generator needs no npm deps" — true when written, false the
      # moment the dependency landed, and the only place that runs is this
      # workflow, so the first symptom was a red weekly refresh with
      # ERR_MODULE_NOT_FOUND. `scripts/star-history-workflow.test.mjs` now pins
      # the install step against the script's own imports.
      - uses: ./.github/actions/setup-node-pnpm

      # gh is pre-installed on the runner; GH_TOKEN authenticates its API calls.
      # The generator writes .github/star-history.svg relative to the repo root
      # (untracked on main); the publish step copies it into the star-history
      # branch checkout.
      - name: Regenerate the chart
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/gen-star-history.mjs

      # No [skip ci] needed: ci.yml triggers only on main, never on this branch.
      - name: Publish to the star-history branch if changed
        run: |
          cp .github/star-history.svg chart/star-history.svg
          cd chart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add star-history.svg
          git diff --cached --quiet && echo "No star-history changes" && exit 0
          git commit -m "chore: refresh star-history chart"
          git push
