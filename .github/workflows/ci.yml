name: CI

# PULL REQUESTS ONLY — deliberately not `push: [main]`.
#
# Every commit reaching `main` arrives through a PR (branch protection:
# required checks `frontend` + `rust`, `enforce_admins: true`, and — the
# load-bearing part — `strict: true`, which forces the PR branch to contain
# main's tip before it can merge). `strict` is what makes a second run
# pointless: the merge commit's TREE is then byte-identical to the PR head's,
# so a push-triggered run re-tested bytes CI had already passed.
#
# That was not a small waste. It doubled CI for every change (~57 runner-min)
# AND it gated releases: `check-tag-green.sh` reads check-runs on the tagged
# commit, so tagging sat waiting ~22 min for a duplicate run to re-confirm an
# identical tree. Measured on v0.9.28: PR head 635b7dd7 and merge commit
# 7e89a426 both had tree 0e15a780.
#
# The release gate did NOT get weaker — it got more honest. Rather than being
# satisfied by a status this workflow could have stamped on `main` for free,
# `check-tag-green.sh` now resolves the tagged commit to an ancestor with an
# IDENTICAL TREE and requires the real, green PR checks there. See that script
# and `.claude/rules/60-ai-governance.md` §10.
#
# If `strict` is ever turned off, this reasoning collapses — a PR could be
# verified against a stale main and land a tree nothing tested. Re-add
# `push: [main]` in the same change.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; there are no main-branch runs to protect
  # any more. (The old comment guarded against a release tag pointing at a
  # cancelled main run — v0.8.4, audit 20260612. That failure mode is gone with
  # the trigger: the tag gate now reads the PR's own checks, which are never
  # cancelled once merged.)
  cancel-in-progress: true

jobs:
  # Frontend checks: lint, tests, build — platform-independent (jsdom + vite)
  frontend-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # Fetch enough history for the new-deps slopsquatting gate to diff
          # against origin/main.
          fetch-depth: 0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Security audit
        # pnpm 10 audit broken: npm retired legacy endpoint (410), bulk API lands in pnpm 11
        # Track: https://github.com/pnpm/pnpm/issues/11265
        continue-on-error: true
        run: pnpm audit --audit-level=critical

      - name: Slopsquatting gate (new-dep review)
        # Flags newly-added packages that look hallucinated or freshly-published.
        # Background: USENIX Sec 2025 — LLM package hallucination 5-22%, with
        # active "slopsquat" supply-chain attacks. See scripts/check-new-deps.sh.
        run: bash scripts/check-new-deps.sh

      - name: Baseline ratchet (merge-base, all committed baselines)
        # Every gate compares the tree against its baseline in the SAME commit,
        # so a PR can raise its own floor — edit the offending file and its
        # baseline together and every check reports green (audit 20260729 C3;
        # generalized from file-size alone to all 12 baselines by the 20260803
        # review, D2). This re-reads each baseline at the merge base, where the
        # PR cannot have written it, and rejects any loosening.
        #
        # PR-only, and NOT part of `pnpm check:all`: the comparison needs a base
        # ref, which a local checkout cannot guarantee. The checkout above uses
        # fetch-depth: 0, so `git merge-base origin/<base> HEAD` resolves here;
        # if it ever cannot, the script exits 1 rather than skipping.
        if: github.event_name == 'pull_request'
        run: node scripts/check-baseline-ratchet.mjs "origin/${{ github.base_ref }}"

      - run: pnpm check:all

  # Real-WebKit tier. `pnpm check:all` is jsdom-only, and the difference is not
  # cosmetic: real WebKit drains a microtask BETWEEN capture listeners and jsdom
  # does not, which is the premise the whole CJK IME composition gate rests on
  # (issues #1176 / #1179, fixed twice in one week with no automated gate
  # watching). Separate job because it must NOT inherit src/test/setup.ts.
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --with-deps pulls the system libraries WebKit needs on a bare runner.
      # The local `test:browser:install` script omits them: macOS has them and
      # asking for sudo on a dev machine is worse than a clear error.
      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit

      - run: pnpm exec vitest run --config vitest.browser.config.ts

  # Gate job: required by branch protection (exact name "frontend")
  frontend:
    if: always()
    needs: [frontend-run, webkit]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          RESULT: ${{ needs.frontend-run.result }}
          WEBKIT: ${{ needs.webkit.result }}
        run: |
          if [ "$RESULT" != "success" ]; then
            echo "frontend-run: $RESULT"
            exit 1
          fi
          if [ "$WEBKIT" != "success" ]; then
            echo "webkit: $WEBKIT"
            exit 1
          fi

  # Perf bench: on every run, src/bench/*.bench.ts must execute without error
  # so the suite can't silently rot. On PRs, additionally benches the base ref
  # in a worktree ON THE SAME RUNNER and compares means (same machine, same
  # noise conditions — committed cross-machine baselines are meaningless).
  # The comparison is a NON-BLOCKING signal (continue-on-error): shared-runner
  # variance makes a hard gate cry wolf; the step summary carries the verdict.
  # Threshold and semantics: scripts/compare-bench.mjs (2.5x mean, 1 ms floor).
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm bench --outputJson /tmp/bench-current.json

      - name: Bench base ref (same-runner reference)
        id: bench-base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git worktree add /tmp/bench-base FETCH_HEAD
          cd /tmp/bench-base
          pnpm install --frozen-lockfile
          pnpm bench --outputJson /tmp/bench-base.json
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Compare against base (non-blocking signal)
        if: github.event_name == 'pull_request' && steps.bench-base.outcome == 'success'
        continue-on-error: true
        run: node scripts/compare-bench.mjs /tmp/bench-base.json /tmp/bench-current.json

  # Detect if Rust code changed — skip rust-test for frontend-only PRs
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            rust:
              - 'src-tauri/**'
              - 'Cargo.lock'

  rust-test:
    needs: [changes]
    # Path-filtered, full stop. This used to carry `|| github.event_name ==
    # 'push'`, which defeated the filter on every merge to main: a docs-only
    # change still compiled and tested Rust on three OSes (~29 runner-min,
    # Windows alone 14m). With the push trigger gone the clause is dead, and
    # leaving it would silently restore that cost if the trigger came back.
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tauri-deps

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Create sidecar stub for Tauri build script
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            triple="x86_64-pc-windows-msvc"
            ext=".exe"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            triple="x86_64-unknown-linux-gnu"
            ext=""
          else
            triple="aarch64-apple-darwin"
            ext=""
          fi
          touch "src-tauri/binaries/vmark-mcp-server-${triple}${ext}"

      # rustfmt is textual and platform-independent — one OS leg is enough.
      - name: Format check (rustfmt)
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Clippy runs per-OS because cfg-gated platform code (Windows/Linux
      # branches) never compiles on the macOS leg. Runs before tests to fail
      # fast; shares the same build cache.
      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Gate job: required by branch protection (exact name "rust").
  # Passes when rust-test succeeded OR was skipped (frontend-only PR);
  # fails on any real rust-test failure so Rust-touching PRs cannot
  # auto-merge with red Rust CI (audit 20260612 H26).
  rust:
    if: always()
    needs: [changes, rust-test]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          RESULT: ${{ needs.rust-test.result }}
        run: |
          if [ "$RESULT" != "success" ] && [ "$RESULT" != "skipped" ]; then
            echo "rust-test: $RESULT"
            exit 1
          fi

  # cargo-audit is a lockfile-only, platform-independent check — one ubuntu
  # job instead of compiling cargo-audit from source on all 3 OSes
  # (audit 20260612: ~11 runner-minutes per CI run saved).
  rust-audit:
    needs: [changes]
    # Path-filtered — see rust-test. cargo-audit reads Cargo.lock, which the
    # `rust` filter already covers.
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@065d6a08a14e61e89fb0a4c10eecdbdef39c7d8e # v2.85.4
        with:
          tool: cargo-audit

      - name: Security audit (Rust)
        # RUSTSEC-2026-0194/0195: DoS advisories in `quick-xml`, pulled in only
        # transitively and unfixable from here — `plist 1.9.0` (via `tauri 2.11.3`)
        # pins `quick-xml ^0.39.2` and `tauri-winrt-notification` pins `^0.37`,
        # while the fix is >=0.41.0. Neither is reachable without an upstream
        # Tauri/plist release. quick-xml is used only for plist parsing (macOS
        # bundle metadata) and Windows notifications, never for untrusted external
        # XML in VMark. Remove these ignores once a Tauri bump pulls quick-xml >=0.41.
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
