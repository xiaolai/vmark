name: CI

# PULL REQUESTS ONLY — deliberately not `push: [main]`.
#
# Every commit reaching `main` arrives through a PR (branch protection:
# required checks `frontend` + `rust`, `enforce_admins: true`, and — the
# load-bearing part — `strict: true`, which forces the PR branch to contain
# main's tip before it can merge). `strict` is what makes a second run
# pointless: the merge commit's TREE is then byte-identical to the PR head's,
# so a push-triggered run re-tested bytes CI had already passed.
#
# That was not a small waste. It doubled CI for every change (~57 runner-min)
# AND it gated releases: `check-tag-green.sh` reads check-runs on the tagged
# commit, so tagging sat waiting ~22 min for a duplicate run to re-confirm an
# identical tree. Measured on v0.9.28: PR head 635b7dd7 and merge commit
# 7e89a426 both had tree 0e15a780.
#
# The release gate did NOT get weaker — it got more honest. Rather than being
# satisfied by a status this workflow could have stamped on `main` for free,
# `check-tag-green.sh` now resolves the tagged commit to an ancestor with an
# IDENTICAL TREE and requires the real, green PR checks there. See that script
# and `.claude/rules/60-ai-governance.md` §10.
#
# If `strict` is ever turned off, this reasoning collapses — a PR could be
# verified against a stale main and land a tree nothing tested. Re-add
# `push: [main]` in the same change.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; there are no main-branch runs to protect
  # any more. (The old comment guarded against a release tag pointing at a
  # cancelled main run — v0.8.4, audit 20260612. That failure mode is gone with
  # the trigger: the tag gate now reads the PR's own checks, which are never
  # cancelled once merged.)
  cancel-in-progress: true

jobs:

  # ── Frontend verification, split into parallel groups ─────────────────────
  #
  # This was ONE job running `pnpm check:all` end to end: 25 lint gates, then
  # 35k tests with coverage, then three builds — strictly serial, ~22 min, and
  # the critical path of every PR. The groups below are the same 31 steps
  # (`pnpm check:all` still composes exactly them, and check-scripts-parity
  # asserts it), so the critical path becomes the MAX of the groups rather than
  # their SUM.
  #
  # Tests shard because they dominate. Each shard writes a blob report; the
  # merge job reconstitutes them and applies the coverage thresholds to the
  # COMBINED result — verified to reproduce the unsharded numbers
  # (94.28/90.62/93.77/95.13 vs 94.27/90.60/93.74/95.13). Sharding without that
  # merge would silently drop the coverage gate, which is worse than being slow.
  fe-static:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the slopsquatting gate and the baseline ratchet both
          # diff against the merge base.
          fetch-depth: 0
      - uses: ./.github/actions/setup-node-pnpm

      - name: Security audit
        # BLOCKING, against a reviewed allowlist. This used to be
        # `continue-on-error: true` at `--audit-level=critical`, so a vulnerable
        # dependency merged with the check visibly red (audit 20260906, C3).
        # Its stated reason — pnpm 10's audit endpoint returning 410 — no longer
        # reproduces: the scan runs and returns real findings.
        #
        # A new moderate-or-worse advisory fails here; an accepted one is listed
        # in scripts/npm-audit-baseline.json with the reason it is unreachable
        # in the shipped app, and that acceptance fails once its advisory is
        # gone.
        run: node scripts/check-npm-audit.mjs

      - name: Slopsquatting gate (new-dep review)
        # Flags newly-added packages that look hallucinated or freshly-published.
        # Background: USENIX Sec 2025 — LLM package hallucination 5-22%, with
        # active "slopsquat" supply-chain attacks. See scripts/check-new-deps.sh.
        run: bash scripts/check-new-deps.sh

      - name: Change size is a decision, not an accident
        # PR-tier like the two gates around it: needs a base ref and the PR
        # body, neither of which a local checkout can guarantee. Over the
        # measured p90 of this repo's own history, the PR body must say the
        # size was intended. It prevents nothing (0 required approvals) — it
        # makes the number visible. See .claude/rules/60-ai-governance.md §13.
        env:
          GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
          # gh api needs a token; the step subprocess does not inherit one otherwise,
          # so the body read failed closed on the first over-threshold PR (#1299).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/check-change-size.mjs "origin/${{ github.base_ref }}"

      - name: Baseline ratchet (merge-base, all committed baselines)
        # Every gate compares the tree against its baseline in the SAME commit,
        # so a PR can raise its own floor — edit the offending file and its
        # baseline together and every check reports green (audit 20260729 C3).
        # This re-reads each baseline at the merge base, where the PR cannot
        # have written it, and rejects any loosening.
        run: node scripts/check-baseline-ratchet.mjs "origin/${{ github.base_ref }}"

      - run: pnpm check:static

  fe-test:
    # Docs-only PRs skip this tier. `fe-static` deliberately does NOT: it runs
    # the markdown gates (lint:emdash scans every *.md, lint:keybinding-manifest
    # reads website/guide/shortcuts.md), so prose still gets checked.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm

      # Blob reports carry this shard's coverage; fe-coverage merges them and
      # is the ONLY place thresholds are applied.
      #
      # The zeroed thresholds are REQUIRED, not tidiness. A shard runs a quarter
      # of the suite, so it measures ~49% line coverage and would fail the 94.7%
      # global floor every time — all four shards did exactly that on the first
      # run of this workflow. Coverage is a property of the WHOLE suite, so the
      # only place it can be judged is after the merge. (Enforced by
      # scripts/check-scripts-parity.test.mjs, so a future edit cannot quietly
      # restore per-shard gating and make the matrix permanently red.)
      #
      # `--reporter=default` alongside `blob` is not cosmetic: the blob reporter
      # REPLACES the console reporter, so a failing shard printed nothing but
      # "Process completed with exit code 1" — no test name, no assertion, no
      # way to tell a real failure from a flake without re-running locally.
      # (Enforced below by check-scripts-parity.)
      #
      # Deliberately ONE long line rather than a folded `>-` block. `ci.yml` is
      # on the BYTE_IDENTICAL identity ratchet in
      # `ghaWorkflow/save/__tests__/corpusRoundtrip.test.ts`, and a folded
      # scalar does not survive that CST round trip byte-identically — it
      # dropped the file off the list. A literal `|` block is NOT the
      # alternative: `>-` folds to a single command, while `|` keeps the
      # newlines, so under `bash -e` every flag line would run as its own
      # command.
      - name: Tests (shard ${{ matrix.shard }}/4)
        run: pnpm vitest run --coverage --shard=${{ matrix.shard }}/4 --reporter=blob --reporter=default --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json --coverage.thresholds.lines=0 --coverage.thresholds.functions=0 --coverage.thresholds.statements=0 --coverage.thresholds.branches=0

      # `include-hidden-files` is REQUIRED: vitest writes blobs to
      # `.vitest-reports/`, a dot-directory, and upload-artifact treats
      # everything under one as hidden and skips it by default. The blob was
      # written and then silently not uploaded.
      #
      # `if-no-files-found: error` is the other half. The default is `warn`, so
      # that skip passed the shard and only surfaced two jobs later as
      # `ENOENT: scandir '.vitest-reports'` in fe-coverage — an error message
      # pointing at the consumer instead of the producer. Fail where the file
      # should have been made.
      - uses: actions/upload-artifact@v7
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest-reports/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  fe-coverage:
    # Docs-only PRs skip this tier. `fe-static` deliberately does NOT: it runs
    # the markdown gates (lint:emdash scans every *.md, lint:keybinding-manifest
    # reads website/guide/shortcuts.md), so prose still gets checked.
    needs: [changes, fe-test]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm

      - uses: actions/download-artifact@v8
        with:
          path: .vitest-reports
          pattern: blob-report-*
          merge-multiple: true

      # Thresholds live in vitest.config.ts and apply to the MERGED report, so
      # this is the real coverage gate — the shards deliberately do not gate.
      - name: Merge shard reports and enforce coverage thresholds
        run: pnpm vitest --merge-reports=.vitest-reports --coverage

  fe-servers:
    # Docs-only PRs skip this tier. `fe-static` deliberately does NOT: it runs
    # the markdown gates (lint:emdash scans every *.md, lint:keybinding-manifest
    # reads website/guide/shortcuts.md), so prose still gets checked.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm check:servers

  fe-build:
    # Docs-only PRs skip this tier. `fe-static` deliberately does NOT: it runs
    # the markdown gates (lint:emdash scans every *.md, lint:keybinding-manifest
    # reads website/guide/shortcuts.md), so prose still gets checked.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm
      - run: pnpm check:build

  # Real-WebKit tier. `pnpm check:all` is jsdom-only, and the difference is not
  # cosmetic: real WebKit drains a microtask BETWEEN capture listeners and jsdom
  # does not, which is the premise the whole CJK IME composition gate rests on
  # (issues #1176 / #1179, fixed twice in one week with no automated gate
  # watching). Separate job because it must NOT inherit src/test/setup.ts.
  webkit:
    # Docs-only PRs skip this tier. `fe-static` deliberately does NOT: it runs
    # the markdown gates (lint:emdash scans every *.md, lint:keybinding-manifest
    # reads website/guide/shortcuts.md), so prose still gets checked.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --with-deps pulls the system libraries WebKit needs on a bare runner.
      # The local `test:browser:install` script omits them: macOS has them and
      # asking for sudo on a dev machine is worse than a clear error.
      - name: Install WebKit
        run: pnpm exec playwright install --with-deps webkit

      - run: pnpm exec vitest run --config vitest.browser.config.ts

  # Website validation, on the PR rather than after the merge.
  #
  # `deploy-website.yml` builds and lints the VitePress site, but it runs on
  # push-to-main — i.e. once the change is already in. This tier moves that
  # verification left so a broken site cannot pass a required check and then
  # fail on main (audit 20260906, C7).
  website:
    needs: [changes]
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-pnpm

      - name: Lint website markdown
        run: pnpm --dir website lint:md

      - name: Build website
        run: pnpm --dir website build

  # Gate job: required by branch protection (exact name "frontend").
  #
  # Fails unless EVERY group succeeded. `if: always()` means this runs even when
  # a dependency failed or was skipped, so the check must treat anything other
  # than "success" as a failure — a skipped group is not a passed group, and
  # `needs` alone would let one silently vanish from the gate.
  frontend:
    if: always()
    needs: [changes, fe-static, fe-test, fe-coverage, fe-servers, fe-build, webkit, website]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          STATIC: ${{ needs.fe-static.result }}
          TESTS: ${{ needs.fe-test.result }}
          COVERAGE: ${{ needs.fe-coverage.result }}
          SERVERS: ${{ needs.fe-servers.result }}
          BUILD: ${{ needs.fe-build.result }}
          WEBKIT: ${{ needs.webkit.result }}
          WEBSITE: ${{ needs.website.result }}
          WEBSITE_TOUCHED: ${{ needs.changes.outputs.website }}
        run: |
          # A skip is only a pass when the FILTER said so.
          #
          # This used to accept `skipped` unconditionally, and `changes` was not
          # even in `needs` — so if the filter job failed or was cancelled,
          # every app tier skipped, each one read as a pass, and this REQUIRED
          # check went green having tested nothing (audit 20260906, C1).
          # Executing the old block with STATIC=success and every other result
          # `skipped` returns 0.
          #
          # So: the filter must have SUCCEEDED and produced a usable boolean
          # before its verdict can excuse anything.
          if [ "$CHANGES" != "success" ]; then
            echo "changes: $CHANGES — cannot trust any skip without the filter"
            exit 1
          fi
          case "$CODE" in
            true|false) ;;
            *)
              echo "changes.outputs.code: '$CODE' — expected true or false"
              exit 1
              ;;
          esac

          # `fe-static` runs on EVERY PR, prose included: it carries the
          # markdown gates. It is therefore never legitimately skipped.
          failed=0
          if [ "$STATIC" != "success" ]; then
            echo "fe-static: $STATIC"
            failed=1
          fi

          # The app tiers are path-filtered off for a docs-only PR, and this is
          # a REQUIRED check under `enforce_admins` — without that tolerance no
          # prose PR could be merged by anyone. But it applies ONLY when
          # `code == false`, which is the filter explicitly excluding them.
          for pair in "fe-test:$TESTS" "fe-coverage:$COVERAGE" \
                      "fe-servers:$SERVERS" "fe-build:$BUILD" "webkit:$WEBKIT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$result" = "skipped" ] && [ "$CODE" = "false" ]; then
              echo "$name: skipped (docs-only change)"
              continue
            fi
            echo "$name: $result"
            failed=1
          done

          # The website tier has its OWN filter output, because a PR can touch
          # the site without touching app code and vice versa.
          if [ "$WEBSITE" != "success" ]; then
            if [ "$WEBSITE" = "skipped" ] && [ "$WEBSITE_TOUCHED" = "false" ]; then
              echo "website: skipped (no website changes)"
            else
              echo "website: $WEBSITE"
              failed=1
            fi
          fi

          [ "$failed" -eq 0 ]

  # Perf bench: on every run, src/bench/*.bench.ts must execute without error
  # so the suite can't silently rot. On PRs, additionally benches the base ref
  # in a worktree ON THE SAME RUNNER and compares means (same machine, same
  # noise conditions — committed cross-machine baselines are meaningless).
  # The comparison is a NON-BLOCKING signal (continue-on-error): shared-runner
  # variance makes a hard gate cry wolf; the step summary carries the verdict.
  # Threshold and semantics: scripts/compare-bench.mjs (2.5x mean, 1 ms floor).
  bench:
    # Docs-only PRs skip this tier. `fe-static` deliberately does NOT: it runs
    # the markdown gates (lint:emdash scans every *.md, lint:keybinding-manifest
    # reads website/guide/shortcuts.md), so prose still gets checked.
    needs: [changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm bench --outputJson /tmp/bench-current.json

      - name: Bench base ref (same-runner reference)
        id: bench-base
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          git worktree add /tmp/bench-base FETCH_HEAD
          cd /tmp/bench-base
          pnpm install --frozen-lockfile
          pnpm bench --outputJson /tmp/bench-base.json
        env:
          BASE_REF: ${{ github.base_ref }}

      - name: Compare against base (non-blocking signal)
        if: github.event_name == 'pull_request' && steps.bench-base.outcome == 'success'
        continue-on-error: true
        run: node scripts/compare-bench.mjs /tmp/bench-base.json /tmp/bench-current.json

  # Detect if Rust code changed — skip rust-test for frontend-only PRs — and
  # whether anything but PROSE changed, so a docs-only PR skips the app tiers.
  #
  # `predicate-quantifier: some-with-excludes` is load-bearing. Under the
  # DEFAULT ('some') a file counts if it matches at least one pattern, so `'**'`
  # would match everything and `code` would always be true — the filter would
  # silently be a no-op that still looked wired up. `some-with-excludes` means
  # "matches a positive pattern AND no negated one", independent of order.
  # Verified present in the pinned SHA's action.yml before relying on it; an
  # unknown input would have been ignored rather than rejected.
  changes:
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      code: ${{ steps.filter.outputs.code }}
      website: ${{ steps.filter.outputs.website }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            rust:
              - 'src-tauri/**'
              - 'Cargo.lock'
            # True when any changed file is NOT prose — i.e. false only for a
            # docs-only PR. The exclusions are an explicit allowlist, not
            # `!**/*.md`, and that distinction is the whole safety argument:
            # there are 50 markdown files under src/, including the
            # markdown-pipeline characterization corpus that round-trip tests
            # READ at runtime. A blanket `!**/*.md` would skip the entire suite
            # on precisely the change most able to break it. Nothing below is
            # read by an app-tier test; the paths that ARE inputs
            # (website/guide/shortcuts.md → lint:keybinding-manifest) belong to
            # fe-static, which never skips.
            code:
              - '**'
              - '!README.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!.claude/**/*.md'
              - '!website/**/*.md'
            # The VitePress site is built and linted only during DEPLOYMENT,
            # which happens after merge — so a broken website change passed
            # every required check and failed on main (audit 20260906, C7).
            # Root `check:build` builds the desktop frontend, not VitePress.
            # Markdown counts here: `website/**/*.md` is deliberately excluded
            # from `code` above, so prose changes must reach this filter or the
            # site would still go unverified on exactly the changes that make up
            # most of its history.
            website:
              - 'website/**'

  rust-test:
    needs: [changes]
    # Path-filtered, full stop. This used to carry `|| github.event_name ==
    # 'push'`, which defeated the filter on every merge to main: a docs-only
    # change still compiled and tested Rust on three OSes (~29 runner-min,
    # Windows alone 14m). With the push trigger gone the clause is dead, and
    # leaving it would silently restore that cost if the trigger came back.
    if: needs.changes.outputs.rust == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-tauri-deps

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable branch
        with:
          toolchain: stable
          components: clippy, rustfmt

      # Caches the COMPILED artifacts (`src-tauri/target`), not just the source
      # registry. The hand-rolled `actions/cache` this replaces held only
      # `~/.cargo/registry` + `~/.cargo/git`, so every run re-downloaded nothing
      # and re-compiled everything — which is why the Windows leg took 1330s
      # against macOS 290s and was the binding constraint on merging any
      # Rust-touching PR.
      #
      # `shared-key` (not the default job-derived key) is deliberate: it puts
      # all three OS legs in one namespace so the warmer below can populate it.
      # rust-cache still separates entries by runner OS/arch, rustc version and
      # lockfile hash, so the legs cannot poison each other.
      #
      # WHY THE WARMER IS REQUIRED, not an optimisation: this workflow is
      # `pull_request`-only, and a cache written during a PR run is scoped to
      # that PR's ref — invisible to every other PR. Only caches on the DEFAULT
      # branch are readable by all PRs. Without `rust-cache-warm.yml` populating
      # this same `shared-key` from `main`, every PR would still start cold and
      # this step would buy nothing.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "src-tauri -> target"
          shared-key: "ci-rust-v1"
          # Never persist a cache from a failed compile: a half-written target
          # dir is restored on the next run and can produce failures that do not
          # reproduce anywhere else.
          cache-on-failure: "false"

      - name: Create sidecar stub for Tauri build script
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            triple="x86_64-pc-windows-msvc"
            ext=".exe"
          elif [[ "$RUNNER_OS" == "Linux" ]]; then
            triple="x86_64-unknown-linux-gnu"
            ext=""
          else
            triple="aarch64-apple-darwin"
            ext=""
          fi
          touch "src-tauri/binaries/vmark-mcp-server-${triple}${ext}"

      # rustfmt is textual and platform-independent — one OS leg is enough.
      - name: Format check (rustfmt)
        if: runner.os == 'Linux'
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      # Unused Cargo dependencies. Manifest-only, so like rustfmt it is
      # platform-independent and one leg is enough. It lives HERE rather than in
      # `pnpm check:all` because check:all never invokes cargo at all — the
      # frontend runner has no Rust toolchain, and adding one to it would pay a
      # multi-minute install to lint a TOML file. Measured clean on adoption
      # (2026-08-14), so it ships as a hard failure with no allowlist.
      - name: Unused Cargo dependencies (cargo-machete)
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-machete --locked --version ^0.9 || true
          cargo machete src-tauri

      # Clippy runs per-OS because cfg-gated platform code (Windows/Linux
      # branches) never compiles on the macOS leg. Runs before tests to fail
      # fast; shares the same build cache.
      - name: Lint (clippy, warnings are errors)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - run: cargo test --manifest-path src-tauri/Cargo.toml

  # Gate job: required by branch protection (exact name "rust").
  # Passes when rust-test succeeded OR was skipped (frontend-only PR);
  # fails on any real rust-test failure so Rust-touching PRs cannot
  # auto-merge with red Rust CI (audit 20260612 H26).
  rust:
    if: always()
    # rust-audit joined this list in audit 20260906 (C3): cargo audit ran on
    # every Rust PR but reported into no REQUIRED check, so a RUSTSEC finding
    # could not block a merge.
    needs: [changes, rust-test, rust-audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check result
        env:
          CHANGES: ${{ needs.changes.result }}
          RUST_TOUCHED: ${{ needs.changes.outputs.rust }}
          RESULT: ${{ needs.rust-test.result }}
          AUDIT: ${{ needs.rust-audit.result }}
        run: |
          # Same reasoning as the `frontend` aggregate (audit 20260906, C1): a
          # skip is a pass only when the filter SAID the tier does not apply.
          # A failed filter skips rust-test and used to read as success here.
          if [ "$CHANGES" != "success" ]; then
            echo "changes: $CHANGES — cannot trust a skip without the filter"
            exit 1
          fi
          case "$RUST_TOUCHED" in
            true|false) ;;
            *)
              echo "changes.outputs.rust: '$RUST_TOUCHED' — expected true or false"
              exit 1
              ;;
          esac

          failed=0
          for pair in "rust-test:$RESULT" "rust-audit:$AUDIT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [ "$result" = "success" ]; then
              continue
            fi
            if [ "$result" = "skipped" ] && [ "$RUST_TOUCHED" = "false" ]; then
              echo "$name: skipped (no Rust changes)"
              continue
            fi
            echo "$name: $result"
            failed=1
          done
          [ "$failed" -eq 0 ]

  # cargo-audit is a lockfile-only, platform-independent check — one ubuntu
  # job instead of compiling cargo-audit from source on all 3 OSes
  # (audit 20260612: ~11 runner-minutes per CI run saved).
  rust-audit:
    needs: [changes]
    # Path-filtered — see rust-test. cargo-audit reads Cargo.lock, which the
    # `rust` filter already covers.
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install cargo-audit
        uses: taiki-e/install-action@e67fa11c4b9316fa714ddf0abed07a0c3143b95b # v2.87.4
        with:
          tool: cargo-audit

      - name: Security audit (Rust)
        # RUSTSEC-2026-0194/0195: DoS advisories in `quick-xml`, pulled in only
        # transitively and unfixable from here — `plist 1.9.0` (via `tauri 2.11.3`)
        # pins `quick-xml ^0.39.2` and `tauri-winrt-notification` pins `^0.37`,
        # while the fix is >=0.41.0. Neither is reachable without an upstream
        # Tauri/plist release. quick-xml is used only for plist parsing (macOS
        # bundle metadata) and Windows notifications, never for untrusted external
        # XML in VMark. Remove these ignores once a Tauri bump pulls quick-xml >=0.41.
        run: cargo audit --file src-tauri/Cargo.lock --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
