# WI-5.1 (markdown-testing plan, ADR-6) — the scheduled soak tier.
#
# Never PR-gating: deep fuzz, full-size pathological inputs, and
# runtime-download corpora run here weekly (and on demand), where a hang is a
# visibly red/timed-out run and artifacts carry the evidence. Seeds and
# scales are env-controlled re-runs of the SAME suites the PR tier runs
# small, plus the `*.soak.test.ts` files the default vitest config excludes.
name: soak

on:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC
  workflow_dispatch:
    inputs:
      fuzz_runs:
        description: "fast-check runs for the editing fuzz"
        default: "500"
      fuzz_seed:
        description: "fast-check seed (empty = keep CI default)"
        default: ""

jobs:
  soak:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Deep editing-op fuzz (scaled)
        env:
          FUZZ_RUNS: ${{ inputs.fuzz_runs || '500' }}
          FUZZ_SEED: ${{ inputs.fuzz_seed }}
        run: pnpm vitest run src/test/editingFuzz.test.ts

      - name: Full-size pathological inputs (killable child)
        env:
          PATHOLOGICAL_SCALE: "8"
        run: pnpm vitest run src/utils/markdownPipeline/__tests__/pathological/

      - name: Runtime-download corpora (Pro Git, editing-traces, OSS-Fuzz)
        run: pnpm test:soak

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: soak-evidence
          path: |
            e2e/artifacts/
            src/test/__screenshots__/
          if-no-files-found: ignore
