name: Baseline review

# WI-AF3.3 — the standing report on frozen debt (finding F5).
#
# A ratchet stops debt GROWING. It never asks anyone to pay it, which is how
# ~450 frozen units sat unmoved across 27 baselines with every gate green.
#
# THIS REPORTS, IT DOES NOT JUDGE. An earlier revision gave every baseline a
# review date and failed once one passed. Those dates were invented — a
# fortnightly stagger picked by the agent writing the file, recorded under
# `owner: maintainer` — and exactly one tracked baseline has any paydown history
# to derive a rate from. What is measurable without anyone's say-so is how many
# entries each baseline holds and how long it has gone unchanged, so that is
# what lands in the issue. A row that never moves is the finding.
#
# WHY NOT A PR GATE. Staleness is a property of TODAY, not of a diff. A
# calendar-triggered CI failure reddens someone's unrelated PR with no action
# available to its author, and a gate like that gets switched off rather than
# obeyed. The PR tier enforces the part that IS a property of a diff: the
# merge-base ratchet holds the `tracked` list as an identity set, so a baseline
# cannot quietly stop being tracked.
#
# Reporting is a separate job from measurement for the same least-privilege
# reason as mutation.yml: only the job that runs no project code holds
# `issues: write`.
#
# liveness-gate: true
# cadence-days: 8
# on-failure: rolling-issue
#   ^ read by scripts/check-gate-liveness.mjs (WI-AF2.4). This workflow is a
#     gate that must keep producing verdicts, and it is not exempt from the rule
#     it exists to enforce.

on:
  workflow_dispatch:
  # Weekly, Monday 08:00 UTC — after mutation (06:00), rust-coverage (06:30)
  # and tier0-e2e (07:00), so the scheduled suites do not contend.
  schedule:
    - cron: "0 8 * * 1"

permissions:
  contents: read

concurrency:
  group: baseline-review
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      hasDebt: ${{ steps.report.outputs.hasDebt }}
      watcherStale: ${{ steps.watcher.outputs.stale }}
      body: ${{ steps.report.outputs.body }}
      watcherDetail: ${{ steps.watcher.outputs.detail }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Staleness is `git log -1 -- <path>`, which in the default depth-1
          # checkout sees ONE commit and reports 0d for every baseline — the
          # shape of a healthy register, and the exact signal this report
          # exists to surface. Issue #1248 was filed that way.
          fetch-depth: 0

      # NO `cache: pnpm` here, and no pnpm setup — deliberately. Every step
      # below runs `node scripts/*.mjs` straight off the checkout; nothing in
      # this job installs dependencies. Asking setup-node to cache a pnpm store
      # that is never created makes its POST step fail with "Path Validation
      # Error: Path(s) specified in the action for caching do(es) not exist",
      # which reddens `measure` after it has already produced its outputs — and
      # `report` needs `measure` to succeed, so the weekly issue silently stops
      # being filed while the measurement itself was fine. Observed 2026-08-17.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Validation first, and it is a HARD failure: an inconsistent schedule
      # (a baseline tracked nowhere, a stale key) means the report below would
      # be measuring an incomplete picture while looking authoritative.
      - name: Validate the register covers every baseline
        run: node scripts/check-review-schedule.mjs

      # The other half of the mutual watch (WI-AF2.4): gate-liveness.yml cannot
      # report its own silence, so this job — on a different day — checks it.
      #
      # Its result is CAPTURED, not swallowed. `continue-on-error: true` here
      # would be the exact pattern WI-4 deleted from mutation.yml after it hid
      # eight consecutive failures; failing the step outright would instead
      # suppress the debt report below, since `report` needs this job to
      # succeed. So the finding becomes an output and lands in the same issue.
      - name: Watch the watcher
        id: watcher
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          out=$(node scripts/check-gate-liveness.mjs --only gate-liveness.yml 2>&1)
          code=$?
          set -e
          echo "$out"
          {
            echo "stale=$([ $code -ne 0 ] && echo true || echo false)"
            echo "detail<<WATCH_EOF"
            echo "$out"
            echo "WATCH_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Report debt and staleness
        id: report
        run: |
          out=$(node scripts/check-review-schedule.mjs --report)
          echo "$out"
          {
            echo "hasDebt=true"
            echo "body<<REPORT_EOF"
            echo "$out"
            echo ""
            echo "_Filed by [baseline-review](https://github.com/${GITHUB_REPOSITORY}/actions/workflows/baseline-review.yml) — run ${GITHUB_RUN_ID}._"
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

  report:
    needs: measure
    # Either signal opens the issue — a silent watcher is as much a finding
    # as stalled debt.
    if: needs.measure.outputs.hasDebt == 'true' || needs.measure.outputs.watcherStale == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the rolling issue
        env:
          GH_TOKEN: ${{ github.token }}
          BODY: |
            ${{ needs.measure.outputs.body }}

            <details><summary>gate-liveness watcher</summary>

            ```
            ${{ needs.measure.outputs.watcherDetail }}
            ```
            </details>
          REPO: ${{ github.repository }}
        shell: bash
        # ONE rolling issue, found by label. Creating a fresh issue each week
        # would turn a standing reminder into a backlog of duplicates, which is
        # the failure mode the cost-report workflow already documented.
        run: |
          # The label must EXIST before it is used: `gh issue create --label`
          # fails outright on an unknown label, and it did — this workflow's
          # first real run died with "could not add label: 'baseline-review' not
          # found", having produced its whole report and then thrown it away.
          # Creating it here rather than by hand keeps the workflow
          # self-contained: a fresh clone or fork has no labels either.
          # `--force` makes this idempotent.
          gh label create baseline-review --repo "$REPO" --force \
            --color BFD4F2 --description "Rolling issue: frozen baselines due for review."
          existing=$(gh issue list --repo "$REPO" --label baseline-review --state open \
                       --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue edit "$existing" --repo "$REPO" --body "$BODY"
            echo "updated #$existing"
          else
            gh issue create --repo "$REPO" --label baseline-review \
              --title "Baseline debt — standing report" --body "$BODY"
          fi
